name: CI

on:
  push:
    branches: [main, rust-port]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        # TODO(port): remove -A dead_code once the command palette wires config::save.
        run: cargo clippy --all-targets -- -D warnings -A dead_code

      - name: Run tests
        run: cargo test
